# ДЗ2, раунд 2: улучшения, выведенные из анализа раунда 1 (homework2.md, §6).
#
# Главный вывод раунда 1: тренировочный соперник учит только тем ошибкам, которые сам наказывает.
# Смесь соперников дала защиту ценой нападения. Два новых изменения бьют в те же ошибки
# (пропуск победы в 1 ход, пропуск блока), но не через соперника:
#   threats — признаки угроз: к двум входным плоскостям добавлены клетки, где немедленно
#             достраивает 4 в ряд ходящий игрок, и клетки, где это сделает соперник;
#   shaping — штраф −0,5 в награде перехода за пропущенную победу или незакрытую угрозу,
#             независимо от того, наказал ли ошибку соперник (соперник остаётся random).
# План — факторный 2x2, абляции — удаление одного компонента из полной модели.
#
# ВСЁ, кроме перечисленных override'ов, наследуется из configs/baseline.yaml без изменений.
# Величина штрафа 0,5 («половина проигрыша») назначена до первого запуска и не подбиралась.

name: hw2_round2
base_config: configs/baseline.yaml

design:
  factors: [threats, shaping]
  labels:
    threats: ["вход: фишки", "вход: фишки + угрозы"]
    shaping: ["награда: только исход", "награда: исход + штраф за ошибку"]
  interaction: "Взаимодействие: эффект штрафа при признаках угроз минус эффект штрафа без них"

report:
  file: homework2.md
  tag: r2

# Тест раунда 1 (seed 3000) просмотрен при анализе его результатов, поэтому для раунда 2
# назначен новый seed 4000. Baseline оценивается на нём теми же чекпойнтами ДЗ1.
test:
  opponents: [random, tactical, lookahead, kaggle_negamax]
  games_per_opponent: 400
  seed: 4000
  opening_plies: 2

arms:
  - name: baseline_dqn
    id: H0
    label: "Baseline ДЗ1: MLP 2×256, вход 2 плоскости, награда только за исход"
    factors: {threats: false, shaping: false}
    reuse_runs: runs/baseline_dqn
    change: "нет (точка отсчёта)"
    hypothesis: "Точка отсчёта. Ожидаем ~0,29 на новом тесте, как на тестах ДЗ1 (0,293) и раунда 1 (0,285)."

  - name: threats_mlp
    id: H3
    label: "H3: признаки угроз на входе сети"
    factors: {threats: true, shaping: false}
    overrides:
      model.features: threats
    change: "model.features: plain → threats (вход 2×6×7 → 4×6×7: + клетки немедленной победы своей и соперника)"
    hypothesis: >-
      Baseline пропускает 28% побед в один ход и 86% блоков, а свёрточная сеть при том же числе
      параметров (H2) этого не изменила: сети не хватает не способа смотреть на доску, а сигнала,
      чтобы выучить 69 узоров. Мы считаем, что если дать узор готовым признаком (две плоскости:
      где достраивает четвёрку ходящий, где соперник), сети останется лишь связать признак с
      ценностью, поэтому пробуем те же MLP, соперника и бюджет с четырьмя входными плоскостями.
      Ожидание: рост macro score, снижение доли пропущенных побед и пропущенных блоков.
    expected_error: missed_win_rate

  - name: shaped_mlp
    id: H4
    label: "H4: штраф за тактическую ошибку в награде"
    factors: {threats: false, shaping: true}
    overrides:
      train.shaping: {missed_win: 0.5, missed_block: 0.5}
    change: "train.shaping: {} → {missed_win: 0.5, missed_block: 0.5} (−0,5 к награде перехода за пропущенную победу или незакрытую угрозу)"
    hypothesis: >-
      В раунде 1 защита улучшалась только у плеч, где соперник (тактик) наказывал каждую незакрытую
      угрозу, но ценой умения добивать random. Мы считаем, что наказывать ошибку должен сигнал
      обучения, а не соперник: тогда соперник может остаться random (нападение сохраняется), а защита
      всё равно выучится. Поэтому пробуем штраф −0,5 за пропущенную победу и за незакрытую угрозу.
      Ожидание: рост macro score и снижение доли пропущенных блоков при сохранении игры против random.
    expected_error: missed_block_rate

  - name: threats_shaped_mlp
    id: H3+H4
    label: "H3+H4: признаки угроз и штраф за ошибку"
    factors: {threats: true, shaping: true}
    overrides:
      model.features: threats
      train.shaping: {missed_win: 0.5, missed_block: 0.5}
    change: "оба изменения сразу"
    hypothesis: >-
      Признаки говорят сети, где угроза, штраф говорит, что её нельзя пропускать. Мы считаем, что
      изменения дополняют друг друга (признак без штрафа может остаться невостребованным, штраф без
      признака требует выучить узор), поэтому ожидаем, что полная модель не хуже лучшего одиночного
      улучшения, а взаимодействие положительное.

ablations:
  - name: "A4: убрать признаки угроз (threats_shaped_mlp → shaped_mlp)"
    full: threats_shaped_mlp
    ablated: shaped_mlp
    removed: "вход снова 2 плоскости, штраф остаётся"
  - name: "A5: убрать штраф (threats_shaped_mlp → threats_mlp)"
    full: threats_shaped_mlp
    ablated: threats_mlp
    removed: "награда снова только за исход, признаки угроз остаются"

improvements:
  - {name: "H3: признаки угроз", new: threats_mlp, ref: baseline_dqn, expected_error: missed_win_rate}
  - {name: "H4: штраф за ошибку", new: shaped_mlp, ref: baseline_dqn, expected_error: missed_block_rate}
  - {name: "H3+H4: оба изменения", new: threats_shaped_mlp, ref: baseline_dqn, expected_error: null}
