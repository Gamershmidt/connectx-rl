[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connectx-rl"
version = "0.1.0"
description = "ConnectX (Connect Four): RL-постановка, DQN baseline и протокол оценки"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "kaggle-environments>=1.14",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
